<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapday · Demo siteler</title>
<meta name="description" content="Mapday.ai tarafından hazırlanan örnek işletme siteleri.">
<meta property="og:title" content="Mapday · Demo siteler">
<meta property="og:description" content="Mapday.ai tarafından hazırlanan örnek işletme siteleri.">
<meta property="og:image" content="https://mujdemapday.github.io/kafe/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%E2%9C%A8%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#FBF6EF;color:#3A2A1F;font:16px/1.6 "Segoe UI",system-ui,sans-serif;padding:32px 16px}
  main{max-width:560px;width:100%;text-align:center}
  h1{font:600 clamp(32px,7vw,46px)/1.1 Georgia,serif;margin:0 0 10px}
  p.alt{color:#7C6656;margin:0 0 30px}
  .klasor{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:22px;padding:24px 22px;margin:16px 0;box-shadow:0 16px 38px -24px rgba(90,50,20,.55);transition:transform .15s}
  .klasor:hover{transform:translateY(-3px)}
  .klasor .ust{display:flex;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:700}
  .klasor .ust i{font-style:normal;font-size:34px}
  .klasor small{display:block;color:#7C6656;font-size:14.5px;margin-top:4px}
  .cipler{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
  .cipler span{font-size:13.5px;font-weight:600;padding:6px 14px;border-radius:999px;background:#F5EADC;color:#9C5E27}
  .guz .cipler span{background:#FCE4EC;color:#C2255A}
</style>
</head>
<body>
<main>
  <h1>Mapday demo siteler</h1>
  <p class="alt">İşletmeniz için hazırladığımız örnek siteler. Bir sektör seçin.</p>
  <a class="klasor" href="kafe/">
    <div class="ust"><i>☕</i>Kafe</div>
    <small>3 farklı tasarım</small>
    <div class="cipler"><span>Kurumsal</span><span>Sade</span><span>Animasyonlu</span></div>
  </a>
  <a class="klasor guz" href="guzellik/">
    <div class="ust"><i>💄</i>Güzellik salonu</div>
    <small>3 farklı tasarım</small>
    <div class="cipler"><span>Sade</span><span>Canlı</span><span>Animasyonlu</span></div>
  </a>
</main>
</body>
</html>
